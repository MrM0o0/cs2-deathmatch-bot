# Tooling config for the CS2 Deathmatch Bot.
# Not a packaged library -- this only configures ruff (lint + format) and
# pytest. Install dev tooling with: pip install ruff pytest

[tool.ruff]
line-length = 100
target-version = "py313"
# Datasets, notebooks, and vendored model exports are not ours to lint.
extend-exclude = [
    "*.ipynb",
    "*_backup.py",
    "CS2 Object detection*",
    "merged_dataset*",
    "models/training",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade.
select = ["E", "F", "I", "W", "UP"]
# Entry scripts (the bot and the tools/) deliberately insert the project root
# onto sys.path before importing src.*, so imports are not at the top of file.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures occasionally need long literal lines.
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
